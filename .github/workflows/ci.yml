name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for migration changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

      - name: Setup Supabase CLI
        if: steps.filter.outputs.migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Database Migrations to Supabase Production
        if: steps.filter.outputs.migrations == 'true'
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Pushing migrations to Supabase Production..."
            supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
          else
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD secret is not configured in GitHub Secrets. Skipping database push."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_ORG_ID" ]; then
            npm ci
            npm install --global vercel@latest
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
            echo "url=$url" >> $GITHUB_OUTPUT
          else
            echo "VERCEL_TOKEN, VERCEL_PROJECT_ID, or VERCEL_ORG_ID is not configured in GitHub Secrets. Skipping Vercel deploy."
            echo "url=https://github.com/covunity/chess-platform" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
